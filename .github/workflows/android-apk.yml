name: Build SKY VISION Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "SKY-VISION-starter.zip"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract web project
        run: |
          test -f SKY-VISION-starter.zip
          mkdir app
          unzip -q SKY-VISION-starter.zip -d app
          test -f app/package.json

      - name: Install web and Capacitor dependencies
        working-directory: app
        run: |
          npm install
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/geolocation@6 @capacitor/assets

      - name: Generate branded Android icons
        working-directory: app
        run: |
          mkdir -p resources
          cp public/sky-vision-logo.png resources/icon.png
          cp public/sky-vision-logo.png resources/splash.png
          npx capacitor-assets generate --android

      - name: Configure Android wrapper
        working-directory: app
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.skyvision.weather",
            "appName": "SKY VISION",
            "webDir": "dist",
            "bundledWebRuntime": false
          }
          EOF

      - name: Build web app
        working-directory: app
        run: npm run build

      - name: Generate Android project
        working-directory: app
        run: |
          npx cap add android
          npx cap sync android

      - name: Verify Android location permissions
        working-directory: app
        run: |
          grep -q "ACCESS_FINE_LOCATION" android/app/src/main/AndroidManifest.xml
          grep -q "ACCESS_COARSE_LOCATION" android/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sky-vision-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
