name: Build SKY VISION Professional Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "index.html"
      - "vite.config.ts"
      - "tsconfig.json"
      - "scripts/**"
      - ".github/workflows/android-apk.yml"
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: npm install
      - name: Generate branded launcher assets
        run: |
          mkdir -p resources
          node scripts/make-icons.mjs
          npx capacitor-assets generate --android
      - name: Configure Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.skyvision.weather",
            "appName": "SKY VISION",
            "webDir": "dist",
            "bundledWebRuntime": false,
            "plugins": {
              "Geolocation": {
                "permissions": ["location"]
              }
            }
          }
          EOF
      - name: Build web app
        run: npm run build
      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Add and verify Android location permissions
        run: |
          sed -i '/<application/i\\    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' android/app/src/main/AndroidManifest.xml
          grep -q "ACCESS_FINE_LOCATION" android/app/src/main/AndroidManifest.xml
          grep -q "ACCESS_COARSE_LOCATION" android/app/src/main/AndroidManifest.xml
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sky-vision-professional-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
